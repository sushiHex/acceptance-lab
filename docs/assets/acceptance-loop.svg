<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How the acceptance contract is used</title>
  <desc id="desc">Each task has an acceptance contract in JSON with requirements, properties to keep, and permitted operations. Every step of a task reads that contract. Step 1: Nemotron Nano 4B on vLLM sends one JSON proposal. Step 2: a NeMo Guardrails output rail checks it. Step 3: an MCP executor applies it or refuses it. Step 4: an A2A judge grades the result and returns accepted or failed, with each check. One shared preflight check decides what is permitted for the rail, the executor and the judge. The judge's verdict and the executor's receipt go back to the model as training data: they filter the SFT samples and give the GRPO reward.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#76b900" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#76b900"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2831"/><stop offset="1" stop-color="#18212a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="18" fill="#11161c"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <!-- header -->
    <text x="40" y="50" fill="#f4f7fa" font-size="24" font-weight="700">How the contract is used</text>
    <text x="40" y="74" fill="#8d9cab" font-size="15">Every step of a task reads the same contract. The verdict becomes training data.</text>
    <text x="1160" y="50" text-anchor="end" fill="#6f7f8e" font-size="15" letter-spacing="1.4">acceptance-lab</text>

    <!-- contract -->
    <rect x="330" y="98" width="540" height="78" rx="12" fill="#1a2a1a" stroke="#76b900" stroke-width="1.5"/>
    <text x="354" y="128" fill="#f4f7fa" font-size="18" font-weight="700">Acceptance contract</text>
    <text x="846" y="128" text-anchor="end" fill="#a5db48" font-size="12" font-weight="700" letter-spacing="1.6">JSON · ONE PER TASK</text>
    <g font-size="13" fill="#cfe3b0">
      <rect x="354" y="142" width="118" height="22" rx="11" fill="#243a1c"/>
      <text x="413" y="157" text-anchor="middle">requirements</text>
      <rect x="482" y="142" width="152" height="22" rx="11" fill="#243a1c"/>
      <text x="558" y="157" text-anchor="middle">properties to keep</text>
      <rect x="644" y="142" width="178" height="22" rx="11" fill="#243a1c"/>
      <text x="733" y="157" text-anchor="middle">permitted operations</text>
    </g>

    <!-- contract is read by every step -->
    <g fill="none" stroke="#4f7a1e" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" marker-end="url(#dot)">
      <path d="M380 176C380 205 170 200 170 232"/>
      <path d="M520 176C520 205 460 200 460 232"/>
      <path d="M680 176C680 205 750 200 750 232"/>
      <path d="M820 176C820 205 1040 200 1040 232"/>
    </g>

    <!-- steps -->
    <g fill="url(#card)" stroke="#33414c" stroke-width="1">
      <rect x="60" y="236" width="220" height="86" rx="10"/>
      <rect x="350" y="236" width="220" height="86" rx="10"/>
      <rect x="640" y="236" width="220" height="86" rx="10"/>
      <rect x="930" y="236" width="220" height="86" rx="10" stroke="#76b900"/>
    </g>
    <g fill="#8d9cab" font-size="12" font-weight="700" letter-spacing="1.6">
      <text x="80" y="262">1 · PROPOSE</text>
      <text x="370" y="262">2 · CHECK</text>
      <text x="660" y="262">3 · EXECUTE</text>
      <text x="950" y="262" fill="#a5db48">4 · GRADE</text>
    </g>
    <g fill="#f4f7fa" font-size="18" font-weight="600">
      <text x="80" y="288">Nemotron Nano 4B</text>
      <text x="370" y="288">NeMo Guardrails</text>
      <text x="660" y="288">Executor</text>
      <text x="950" y="288">Judge</text>
    </g>
    <g fill="#aab7c3" font-size="14">
      <text x="80" y="309">on vLLM · one JSON proposal</text>
      <text x="370" y="309">output rail</text>
      <text x="660" y="309">MCP server · applies or refuses</text>
      <text x="950" y="309">A2A agent · accepted or failed</text>
    </g>

    <!-- flow arrows -->
    <g fill="none" stroke="#76b900" stroke-width="2" stroke-linecap="round" marker-end="url(#head)">
      <path d="M284 279H342"/><path d="M574 279H632"/><path d="M864 279H922"/>
    </g>

    <!-- guarding bracket -->
    <g fill="none" stroke="#5b6b78" stroke-width="1.5" stroke-linecap="round">
      <path d="M460 330V344H1040V330"/><path d="M750 330V344"/>
    </g>
    <text x="750" y="368" text-anchor="middle" fill="#a5db48" font-size="12" font-weight="700" letter-spacing="1.6">GUARDING</text>
    <text x="750" y="388" text-anchor="middle" fill="#aab7c3" font-size="14">one shared preflight check decides what is permitted</text>

    <!-- training loop -->
    <path d="M1150 290C1176 290 1176 462 1116 462H230C170 462 170 400 170 330" fill="none" stroke="#76b900" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
    <rect x="370" y="447" width="460" height="30" rx="15" fill="#11161c"/>
    <text x="600" y="467" text-anchor="middle" font-size="14">
      <tspan fill="#a5db48" font-size="12" font-weight="700" letter-spacing="1.6">TRAINING</tspan>
      <tspan fill="#aab7c3" dx="10">verdict and receipt: SFT filter, GRPO reward</tspan>
    </text>
  </g>
</svg>
